[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-titan"
dynamic = ["version"]
description = "A JAX-native MPMD training framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
# JAX-Titan also needs the patched jax/jaxlib/ROCm wheels and Shardy's
# `shardy-mpmd` JAX package; see docs/getting_started.md.
dependencies = [
    "absl-py",
    "immutabledict",
    "jaxtyping",
    "numpy",
    "optax",
    "orbax-checkpoint",
    "pyarrow",
    "tiktoken",
    "typing_extensions",
]

[project.optional-dependencies]
test = ["chex", "pytest"]
# Figures of training runs (jaxtitan.observability.plot).
plots = ["matplotlib>=3.8"]
# The `triton` and `gluon` operator providers. JAX-Triton itself comes from the
# third_party/jax-triton submodule; see docs/getting_started.md.
triton = ["triton>=3.7"]
# MaxText models (jaxtitan.models.adapters.maxtext). The maxtext package
# declares no dependencies; these are what its model code imports.
maxtext = [
    "maxtext==0.2.5",
    "aqtp",
    "drjax>=0.2.1",
    "flax",
    "grain",
    "huggingface_hub",
    "jinja2",
    "omegaconf",
    "pathwaysutils>=0.1.11",
    "pillow",
    "psutil",
    "pydantic",
    "qwix>=0.1.6",
    "sentencepiece",
    "sympy",
    "tokamax>=0.0.14,!=0.1.0",
    "transformers>=5.8.0",
]
# MaxDiffusion FLUX.1 (jaxtitan.models.adapters.maxdiffusion): what its model
# code imports. MaxDiffusion itself comes from a patched checkout; see
# docs/getting_started.md.
maxdiffusion = [
    "aqtp",
    "einops",
    "flax",
    "google-cloud-storage",
    "huggingface_hub",
    "pillow",
    "pyyaml",
    "requests",
    "tensorboardx",
]

[tool.setuptools.dynamic]
version = {attr = "jaxtitan.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jaxtitan*"]
