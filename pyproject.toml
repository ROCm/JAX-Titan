[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-titan"
dynamic = ["version"]
description = "A JAX-native MPMD training framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
# JAX-Titan also needs the patched jax/jaxlib/ROCm wheels and Shardy's
# `shardy-mpmd` JAX package; see docs/getting_started.md.
dependencies = [
    "absl-py",
    "immutabledict",
    "jaxtyping",
    "numpy",
    "optax",
    "orbax-checkpoint",
    "pyarrow",
    "tiktoken",
    "typing_extensions",
]

[project.optional-dependencies]
test = ["chex", "pytest"]

[tool.setuptools.dynamic]
version = {attr = "jaxtitan.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jaxtitan*"]
