[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-titan"
dynamic = ["version"]
description = "A JAX-native MPMD training framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
# JAX-Titan also needs the patched jax/jaxlib/ROCm wheels and Shardy's
# `shardy-mpmd` JAX package; see docs/getting_started.md.
dependencies = [
    "absl-py",
    "immutabledict",
    "jaxtyping",
    "numpy",
    "optax",
    "orbax-checkpoint",
    "pyarrow",
    "tiktoken",
    "typing_extensions",
]

[project.optional-dependencies]
test = ["chex", "pytest"]
# MaxText models (jaxtitan.models.adapters.maxtext). The maxtext package
# declares no dependencies; these are what its model code imports.
maxtext = [
    "maxtext==0.2.5",
    "aqtp",
    "drjax>=0.2.1",
    "flax",
    "grain",
    "huggingface_hub",
    "jinja2",
    "omegaconf",
    "pathwaysutils>=0.1.11",
    "pillow",
    "psutil",
    "pydantic",
    "qwix>=0.1.6",
    "sentencepiece",
    "sympy",
    "tokamax>=0.0.14,!=0.1.0",
    "transformers>=5.8.0",
]

[tool.setuptools.dynamic]
version = {attr = "jaxtitan.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jaxtitan*"]
