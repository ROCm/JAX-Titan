#
# The CPU job installs JAX from PyPI, so it runs only tests that need neither
# the patched jaxlib nor Shardy's MPMD package (docs/getting_started.md).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpu-tests:
    name: CPU tests (JAX from PyPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install JAX-Titan
        run: python -m pip install -e ".[test]"
      - name: Show installed versions
        run: python -m pip freeze
      - name: Run tests
        run: python -m pytest tests/test_agent_skills.py

  gpu-smoke:
    name: GPU smoke test (MI350)
    runs-on: linux-jax-titan-mi350-1
    # A pull request from a fork never runs on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    container:
      image: ghcr.io/rocm/jax-base-ubu24.therock-10.1@sha256:9abb85fde7485b89db61f87d5f583bb1c3b980d479fff7d6d7ed988d652c57b3 # latest on 2026-11-13
      options: --device=/dev/kfd --device=/dev/dri --group-add video --shm-size 64G --env-file /etc/podinfo/gha-gpu-isolation-settings
    steps:
      - name: Show the GPUs
        run: |
          # TheRock images have no /opt/rocm; rocminfo is in the SDK's bin directory.
          export PATH="$(rocm-sdk path --bin):$PATH"
          rocminfo | grep gfx
